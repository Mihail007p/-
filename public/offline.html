<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1020" />
    <title>Нет подключения — CloudArcade</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; color: #f8fafc; background: radial-gradient(ellipse at top, #241653 0, #0b1020 55%); text-align: center; }
      main { width: min(100%, 460px); padding: 36px 28px; border: 1px solid #ffffff20; border-radius: 28px; background: #ffffff0a; box-shadow: 0 24px 80px #0008; }
      .icon { font-size: 48px; }
      h1 { margin: 16px 0 8px; font-size: clamp(24px, 6vw, 32px); }
      p { margin: 0; color: #cbd5e1; line-height: 1.6; }
      button { margin-top: 24px; padding: 12px 20px; border: 0; border-radius: 999px; color: white; background: #7c3aed; font: inherit; font-weight: 700; cursor: pointer; }
      button:focus-visible { outline: 3px solid #c4b5fd; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <div class="icon" aria-hidden="true">📡</div>
      <h1>Нет подключения к интернету</h1>
      <p>Подключитесь к сети и повторите попытку. Для запуска игр CloudArcade также требуется интернет.</p>
      <button type="button" onclick="window.location.reload()">Повторить</button>
    </main>
  </body>
</html>
